/**:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: false
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    visualize: true
    planner_frequency: 0.2
    # Do not spend a full timeout retrying a frontier blocked by the global
    # costmap boundary; choose another reachable frontier instead.
    progress_timeout: 25.0
    lock_goal_until_reached: true
    goal_update_min_distance: 0.75
    goal_replan_min_period: 20.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 1.0
    min_frontier_size: 0.5
